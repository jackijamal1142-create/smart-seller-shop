
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5fb;color:#17243b}
header{background:#142b50;color:white;text-align:center;padding:24px}
header h1{margin:0;font-size:28px}
main{max-width:440px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 25px #142b5015}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{width:50%;background:#e8eef7;color:#142b50}
.tabs button.active{background:#1769d2;color:white}
h2{margin-top:0;text-align:center}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;font-size:15px}
input{border:1px solid #ccd5e2}
button{border:0;background:#1769d2;color:white;font-weight:bold;cursor:pointer}
.hidden{display:none}
.note{text-align:center;color:#68758a;font-size:13px}
.message{text-align:center;color:#1769d2;font-size:14px}
</style>
</head>
<body>
<header>
<h1>Smart Seller</h1>
<p>Welcome to Smart Seller</p>
</header>
<main>
<div class="card">
<div class="tabs">
<button id="loginTab" class="active" onclick="showLogin()">Login</button>
<button id="registerTab" onclick="showRegister()">Register</button>
</div>

<form id="loginForm" onsubmit="demoMessage(event,'Login')">
<h2>Customer Login</h2>
<input type="text" placeholder="Email or Phone Number" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
<p class="note">New customer? Click Register above.</p>
</form>

<form id="registerForm" class="hidden" onsubmit="demoMessage(event,'Registration')">
<h2>Create Account</h2>
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="tel" placeholder="Phone Number" required>
<input type="password" placeholder="Create Password" minlength="8" required>
<input type="password" placeholder="Confirm Password" minlength="8" required>
<button type="submit">Create Account</button>
<p class="note">Already have an account? Click Login above.</p>
</form>
<p id="message" class="message"></p>
</div>
</main>
<script>
function showLogin(){
document.getElementById('loginForm').classList.remove('hidden');
document.getElementById('registerForm').classList.add('hidden');
document.getElementById('loginTab').classList.add('active');
document.getElementById('registerTab').classList.remove('active');
document.getElementById('message').textContent='';
}
function showRegister(){
document.getElementById('registerForm').classList.remove('hidden');
document.getElementById('loginForm').classList.add('hidden');
document.getElementById('registerTab').classList.add('active');
document.getElementById('loginTab').classList.remove('active');
document.getElementById('message').textContent='';
}
function demoMessage(event,type){
event.preventDefault();
if(type==='Registration'){
const fields=document.querySelectorAll('#registerForm input');
if(fields[3].value!==fields[4].value){
document.getElementById('message').textContent='Passwords do not match.';
return;
}
}
document.getElementById('message').textContent=
'Form design ready. Account system will be connected next.';
}
</script>
</body>
</html>
