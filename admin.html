
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#e8eef8;font-family:Arial,sans-serif}
header{background:#17243a;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:21px;margin:0;color:#7ee6d2}
button{border:0;border-radius:8px;padding:10px 14px;background:#20b99a;color:#071b20;font-weight:bold;cursor:pointer;margin:3px}
button.danger{background:#ef6474;color:white}
button.secondary{background:#34445d;color:white}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #3b4b63;border-radius:8px;background:#1a2940;color:white}
label{font-size:13px;color:#b9c8dc}
.login{max-width:400px;margin:65px auto;background:#17243a;padding:25px;border-radius:15px}
#app{display:none}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px;background:#17243a}
nav button{background:#293a54;color:white}
nav button.active{background:#20b99a;color:#071b20}
main{padding:16px;max-width:1200px;margin:auto}
.panel{background:#17243a;border:1px solid #2c3c55;border-radius:12px;padding:16px;margin-bottom:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.stat{background:#22334d;padding:17px;border-radius:10px}
.stat strong{display:block;font-size:25px;color:#7ee6d2;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}
th,td{padding:10px;border-bottom:1px solid #34445d;text-align:left;vertical-align:top}
th{color:#7ee6d2}
.tablewrap{overflow:auto}
.small{font-size:12px;color:#aabbd0}
.hidden{display:none}
.error{color:#ff8792}
.success{color:#7ee6d2}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
  <h1>SMART SELLER — ADMIN</h1>
  <button class="danger" onclick="logout()">Logout</button>
</header>

<div id="loginBox" class="login">
  <h2>Admin Login</h2>
  <label>Email</label>
  <input id="email" type="email" value="jackijamal1142@gmail.com">
  <label>Password</label>
  <input id="password" type="password" placeholder="Admin password">
  <button onclick="login()">Login</button>
  <p id="loginMsg" class="error"></p>
</div>

<div id="app">
<nav id="tabs"></nav>
<main>
  <div id="message"></div>
  <section id="content"></section>
</main>
</div>

<script>
const SUPABASE_URL = "https://biiagnjcyzvqbezabpxz.supabase.co";
const SUPABASE_KEY = "sb_publishable_QrBZWYfua111aN24MjlXHw_c-Cf5yB1";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const tables = [
  ["profiles","Customers"],
  ["products","Products"],
  ["customer_products","Customer Products"],
  ["orders","Orders"],
  ["order_items","Order Items"],
  ["wallet_transactions","Wallet"],
  ["withdrawals","Withdrawals"],
  ["kyc_submissions","KYC"],
  ["support_messages","Customer Service"],
  ["payment_accounts","Payment Accounts"],
  ["payment_submissions","Payment Submissions"],
  ["notifications","Notifications"],
  ["credit_score_history","Credit Score History"],
  ["product_requests","Product Requests"]
];

let currentTable = "profiles";
let records = [];

function msg(text,type="success"){
  const el=document.getElementById("message");
  el.className=type;
  el.textContent=text;
  setTimeout(()=>{el.textContent="";},5000);
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const out=document.getElementById("loginMsg");
  out.textContent="Logging in...";

  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){out.textContent=error.message;return;}

  const {data:admin,error:adminError}=await db
    .from("admin_users").select("user_id")
    .eq("user_id",data.user.id).maybeSingle();

  if(adminError || !admin){
    await db.auth.signOut();
    out.textContent="This account is not authorized as admin.";
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";
  buildTabs();
  showDashboard();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

function buildTabs(){
  const nav=document.getElementById("tabs");
  nav.innerHTML="";
  const all=[["dashboard","Dashboard"],...tables.map(t=>[t[0],t[1]])];
  all.forEach(([id,name])=>{
    const b=document.createElement("button");
    b.textContent=name;
    b.onclick=()=>id==="dashboard"?showDashboard():openTable(id);
    nav.appendChild(b);
  });
}

async function showDashboard(){
  currentTable="";
  const content=document.getElementById("content");
  content.innerHTML="<h2>Admin Dashboard</h2><div class='cards' id='stats'></div>";
  const stats=document.getElementById("stats");
  for(const [table,name] of tables){
    const {count,error}=await db.from(table).select("*",{count:"exact",head:true});
    const card=document.createElement("div");
    card.className="stat";
    card.innerHTML="";
    const title=document.createElement("div");
    title.textContent=name;
    const number=document.createElement("strong");
    number.textContent=error?"Error":(count??0);
    card.append(title,number);
    stats.appendChild(card);
  }
  msg("Dashboard loaded");
}

async function openTable(table){
  currentTable=table;
  document.getElementById("content").innerHTML="<h2>Loading...</h2>";
  const {data,error}=await db.from(table).select("*").order("created_at",{ascending:false}).limit(100);
  if(error){
    document.getElementById("content").innerHTML="<h2>"+escapeHtml(table)+"</h2><p class='error'>"+escapeHtml(error.message)+"</p>";
    return;
  }
  records=data||[];
  renderTable();
}

function renderTable(){
  const content=document.getElementById("content");
  const title=tables.find(t=>t[0]===currentTable)?.[1]||currentTable;
  content.innerHTML=`
    <div class="panel">
      <h2>${escapeHtml(title)}</h2>
      <p class="small">Showing up to 100 records. Select Edit to update a record, or Delete to remove it.</p>
      <button onclick="newRecord()">Add New Record</button>
      <button class="secondary" onclick="openTable(currentTable)">Refresh</button>
    </div>
    <div class="panel" id="editor" style="display:none">
      <h3 id="editorTitle">Record Editor</h3>
      <label>Record data (JSON)</label>
      <textarea id="jsonData" rows="12" spellcheck="false"></textarea>
      <button onclick="saveRecord()">Save Record</button>
      <button class="secondary" onclick="closeEditor()">Cancel</button>
      <p class="small">For new records, do not include an auto-generated id unless your table requires it.</p>
    </div>
    <div class="panel tablewrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>`;
  const head=document.getElementById("tableHead");
  const body=document.getElementById("tableBody");

  if(!records.length){
    head.innerHTML="<tr><th>No records yet</th></tr>";
    body.innerHTML="<tr><td>No data found in this table.</td></tr>";
    return;
  }

  const keys=Object.keys(records[0]);
  head.innerHTML="<tr>"+keys.map(k=>"<th>"+escapeHtml(k)+"</th>").join("")+"<th>Actions</th></tr>";

  records.forEach((record,index)=>{
    const tr=document.createElement("tr");
    keys.forEach(key=>{
      const td=document.createElement("td");
      const value=record[key];
      td.textContent=value===null?"NULL":typeof value==="object"?JSON.stringify(value):String(value);
      tr.appendChild(td);
    });
    const actions=document.createElement("td");
    const edit=document.createElement("button");
    edit.textContent="Edit";
    edit.onclick=()=>editRecord(index);
    const del=document.createElement("button");
    del.textContent="Delete";
    del.className="danger";
    del.onclick=()=>deleteRecord(index);
    actions.append(edit,del);
    tr.appendChild(actions);
    body.appendChild(tr);
  });
}

function newRecord(){
  document.getElementById("editor").style.display="block";
  document.getElementById("editorTitle").textContent="Add New Record";
  document.getElementById("jsonData").value="{}";
  document.getElementById("jsonData").dataset.mode="new";
  document.getElementById("jsonData").dataset.oldid="";
}

function editRecord(index){
  const record=records[index];
  document.getElementById("editor").style.display="block";
  document.getElementById("editorTitle").textContent="Edit Record";
  document.getElementById("jsonData").value=JSON.stringify(record,null,2);
  document.getElementById("jsonData").dataset.mode="edit";
  document.getElementById("jsonData").dataset.oldid=record.id??"";
  document.getElementById("editor").scrollIntoView({behavior:"smooth"});
}

function closeEditor(){
  document.getElementById("editor").style.display="none";
}

async function saveRecord(){
  let obj;
  try{
    obj=JSON.parse(document.getElementById("jsonData").value);
    if(!obj || Array.isArray(obj) || typeof obj!=="object") throw new Error("Enter one JSON object.");
  }catch(e){msg("Invalid JSON: "+e.message,"error");return;}

  const area=document.getElementById("jsonData");
  let result;
  if(area.dataset.mode==="edit"){
    const oldid=area.dataset.oldid;
    if(!oldid){msg("This record has no id. Cannot safely update it.","error");return;}
    delete obj.id;
    result=await db.from(currentTable).update(obj).eq("id",oldid);
  }else{
    result=await db.from(currentTable).insert(obj);
  }
  if(result.error){msg(result.error.message,"error");return;}
  msg("Record saved successfully");
  closeEditor();
  openTable(currentTable);
}

async function deleteRecord(index){
  const record=records[index];
  if(!record.id){msg("This record has no id. Cannot safely delete it.","error");return;}
  if(!confirm("Are you sure you want to delete this record?"))return;
  const {error}=await db.from(currentTable).delete().eq("id",record.id);
  if(error){msg(error.message,"error");return;}
  msg("Record deleted");
  openTable(currentTable);
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

// Restore session if the admin is already logged in.
(async()=>{
  const {data}=await db.auth.getSession();
  if(!data.session)return;
  const user=data.session.user;
  const {data:admin}=await db.from("admin_users")
    .select("user_id").eq("user_id",user.id).maybeSingle();
  if(admin){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").style.display="block";
    buildTabs();
    showDashboard();
  }else{
    await db.auth.signOut();
  }
})();
</script>
</body>
</html>
