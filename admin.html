
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Seller - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f3f5f9;margin:0;padding:20px;color:#222}
main{max-width:950px;margin:auto}
.card{background:white;padding:18px;margin:14px 0;border-radius:10px;box-shadow:0 2px 8px #ddd}
input,button{padding:12px;margin:6px 0;box-sizing:border-box}
input{width:100%;border:1px solid #ccc;border-radius:6px}
button{background:#174ea6;color:white;border:0;border-radius:6px;cursor:pointer}
button.reject{background:#b3261e}
button:disabled{opacity:.5}
.hidden{display:none}
small{color:#666}
img{max-width:220px;display:block;margin:10px 0;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>Smart Seller Admin Dashboard</h1>

<section class="card" id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Gmail">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Welcome, Admin</h2>
<button onclick="loadKYC()">Refresh KYC</button>
<button onclick="logout()">Logout</button>
<p id="message"></p>
</div>

<div class="card">
<h2>KYC Submissions</h2>
<div id="kycList">Loading...</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://biiagnjcyzvqbezabpxz.supabase.co";
const SUPABASE_KEY = "sb_publishable_QrBZWYfua111aN24MjlXHw_c-Cf5yB1";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);

async function login(){
  $("loginMessage").textContent = "Checking...";
  const email = $("email").value.trim();
  const password = $("password").value;

  const {error} = await db.auth.signInWithPassword({email,password});
  if(error){
    $("loginMessage").textContent = error.message;
    return;
  }
  await checkAdmin();
}

async function checkAdmin(){
  const {data:{user},error:authError} = await db.auth.getUser();

  if(authError || !user){
    $("loginBox").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    return;
  }

  const {data:role,error} = await db
    .from("user_roles")
    .select("role")
    .eq("user_id",user.id)
    .eq("role","admin")
    .maybeSingle();

  if(error){
    $("loginMessage").textContent = "Admin permission error: " + error.message;
    return;
  }

  if(!role){
    $("loginMessage").textContent = "Access denied. Admin account required.";
    await db.auth.signOut();
    return;
  }

  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await loadKYC();
}

async function loadKYC(){
  $("message").textContent = "Loading KYC...";
  $("kycList").textContent = "Loading...";

  const {data:rows,error} = await db
    .from("kyc_submissions")
    .select("id,customer_id,document_type,document_url,status,admin_note,created_at")
    .order("created_at",{ascending:false});

  if(error){
    $("kycList").textContent = "KYC error: " + error.message;
    $("message").textContent = "";
    return;
  }

  $("message").textContent = "KYC records: " + rows.length;

  if(!rows.length){
    $("kycList").textContent = "No KYC submissions found.";
    return;
  }

  $("kycList").innerHTML = "";

  for(const item of rows){
    const card = document.createElement("div");
    card.className = "card";

    const heading = document.createElement("h3");
    heading.textContent = item.document_type || "Document";
    card.appendChild(heading);

    const details = document.createElement("p");
    details.textContent =
      "Customer ID: " + item.customer_id +
      " | Status: " + item.status +
      " | Date: " + new Date(item.created_at).toLocaleString();
    card.appendChild(details);

    if(item.document_url){
      const {data:file,error:fileError} = await db.storage
        .from("kyc-documents")
        .createSignedUrl(item.document_url,300);

      if(!fileError && file?.signedUrl){
        const link = document.createElement("a");
        link.href = file.signedUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "View uploaded document";
        card.appendChild(link);
      } else {
        const note = document.createElement("p");
        note.textContent = "Document link error: " + (fileError?.message || "Unavailable");
        card.appendChild(note);
      }
    }

    const approve = document.createElement("button");
    approve.textContent = "Approve";
    approve.onclick = () => updateKYC(item.id,"approved");
    card.appendChild(approve);

    const reject = document.createElement("button");
    reject.textContent = "Reject";
    reject.className = "reject";
    reject.onclick = () => updateKYC(item.id,"rejected");
    card.appendChild(reject);

    $("kycList").appendChild(card);
  }
}

async function updateKYC(id,status){
  if(!confirm("Are you sure you want to mark this KYC as " + status + "?")) return;

  const {error} = await db
    .from("kyc_submissions")
    .update({status})
    .eq("id",id);

  if(error){
    alert("Update error: " + error.message);
    return;
  }

  alert("KYC status updated: " + status);
  await loadKYC();
}

async function logout(){
  await db.auth.signOut();
  $("dashboard").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("password").value = "";
}

db.auth.getSession().then(({data})=>{
  if(data.session) checkAdmin();
});
</script>
</body>
</html>
